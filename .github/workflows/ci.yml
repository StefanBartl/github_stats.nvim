# Three independent jobs so each keeps its own red/green mark. What each gate
# actually runs lives in stylua.toml / .luacheckrc / scripts/test.sh -- this
# workflow only wires those up, it does not re-specify what they check.
# Run stylua/luacheck locally with `stylua --check .` / `luacheck .`; run the
# test suite locally with `scripts/test.sh` (see that file's own header for
# the two env vars it reads).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # PUC Lua 5.4, not LuaJIT: `std = "luajit"` in .luacheckrc pins which
      # globals/stdlib luacheck checks *against* -- independent of which
      # interpreter runs the luacheck binary itself.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck .

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # lib.nvim is a runtime dependency (notify, fs.json, map, window,
      # usercmd, cross.executable, ...) -- a headless run has no plugin
      # manager, so it's checked out the same way TESTS/minimal_init.lua's
      # `.deps/lib.nvim` fallback candidate expects.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      # ui.nvim: github_stats/init.lua's own module-top-level require pulls
      # in ui.contextmenu the instant anything requires github_stats, and
      # several specs require github_stats.dashboard directly -- same
      # hard-dependency treatment as lib.nvim above.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: .deps/ui.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "StefanBartl/testing.nvim"
          path: .deps/testing.nvim
          ref: ci-verified
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
